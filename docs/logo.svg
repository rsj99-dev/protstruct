<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-label="protstruct logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#111C2E"/>
      <stop offset="1" stop-color="#16233A"/>
    </linearGradient>
    <linearGradient id="helix" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13223A"/>
      <stop offset="1" stop-color="#0C1626"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="220" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="758" height="218" rx="27" fill="none" stroke="#26364F" stroke-width="1.5"/>

  <g>
    <rect x="34" y="30" width="160" height="160" rx="38" fill="url(#iconBg)" stroke="#2B3F5C" stroke-width="1.5"/>
    <circle cx="114" cy="112" r="64" fill="none" stroke="#22324A" stroke-width="1.5"/>

    <!-- disulfide bond -->
    <line x1="103" y1="72" x2="125" y2="72" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 3"/>
    <circle cx="92" cy="72" r="10" fill="#F59E0B"/>
    <circle cx="136" cy="72" r="10" fill="#F59E0B"/>
    <text x="92" y="76.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1220">S</text>
    <text x="136" y="76.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1220">S</text>

    <!-- alpha helix -->
    <path d="M64 112 C72 90 88 90 96 112 S120 134 128 112 S152 90 160 112"
          fill="none" stroke="url(#helix)" stroke-width="12" stroke-linecap="round"/>

    <!-- beta sheet arrow -->
    <line x1="76" y1="152" x2="148" y2="152" stroke="url(#sheet)" stroke-width="11" stroke-linecap="round"/>
    <polygon points="146,142 168,152 146,162" fill="#3B82F6"/>

    <!-- turn -->
    <path d="M160 114 C176 124 176 140 164 150" fill="none" stroke="#22C55E" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text x="228" y="104" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="0.5" fill="#F8FAFC">protstruct</text>
  <text x="231" y="136" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif"
        font-size="17" fill="#94A3B8">protein secondary structure toolkit</text>

  <rect x="228" y="152" width="88" height="26" rx="13" fill="#12233B" stroke="#2B4A6F"/>
  <text x="272" y="170" text-anchor="middle" font-family="Consolas, monospace"
        font-size="13" font-weight="700" fill="#7DD3FC">v0.1.0</text>

  <rect x="326" y="152" width="168" height="26" rx="13" fill="#12233B" stroke="#2B4A6F"/>
  <text x="410" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="13" fill="#A5B4C8">zero dependencies</text>
</svg>
