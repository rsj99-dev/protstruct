[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "protstruct"
version = "0.1.0"
description = "蛋白质二级结构（α-螺旋/β-折叠/β-转角）识别、二硫键与盐桥预测、多序列比对工具"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "rsj99-dev", email = "rsj1999@njtech.edu.cn" }]
license = { file = "LICENSE" }
keywords = ["protein", "secondary-structure", "disulfide", "salt-bridge", "fasta", "alignment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
figure = ["matplotlib>=3.3"]

[project.scripts]
protstruct = "protstruct.cli:main"

[tool.setuptools.packages.find]
include = ["protstruct*"]
