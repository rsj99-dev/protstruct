[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "protstruct"
version = "0.2.0"
description = "蛋白质 GOR IV 二级结构（H/E/C）识别、二硫键与盐桥预测、多序列比对与数据库检索工具"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "rsj99-dev", email = "rsj1999@njtech.edu.cn" }]
license = { file = "LICENSE" }
keywords = ["protein", "secondary-structure", "disulfide", "salt-bridge", "fasta", "alignment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.scripts]
protstruct = "protstruct.cli:main"
protstruct-search = "protstruct.search:main"

[project.urls]
Repository = "https://github.com/rsj99-dev/protstruct"

[tool.setuptools.packages.find]
include = ["protstruct*"]

[tool.setuptools.package-data]
protstruct = ["data/*.mod", "data/*.bin", "data/*.txt"]
