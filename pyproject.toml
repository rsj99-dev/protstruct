[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "protstruct"
version = "0.4.0"
description = "PSIPRED V4.1 protein secondary-structure prediction, disulfide and salt-bridge analysis, multiple-sequence alignment, consistency scoring, and database search"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "rsj99-dev", email = "rsj99@126.com" }]
license = { file = "LICENSE" }
keywords = ["protein", "secondary-structure", "psipred", "disulfide", "salt-bridge", "fasta", "alignment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.scripts]
protstruct = "protstruct.cli:main"
protstruct-search = "protstruct.search:main"

[project.urls]
Repository = "https://github.com/rsj99-dev/protstruct"

[tool.setuptools.packages.find]
include = ["protstruct*"]

[tool.setuptools.package-data]
protstruct = ["data/*"]
